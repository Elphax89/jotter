<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>Jotter</title>
    <meta name="description" content="Fast, offline-ready drawing and note app for phone, tablet and desktop. No account, no ads, everything stays on your device." />
    <meta name="theme-color" content="#141311" />
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jotter" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <!-- Icons: Lucide (ISC licence), https://lucide.dev -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></symbol>
        <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5" /></symbol>
        <symbol id="i-rect" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
        <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /></symbol>
        <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="6.5" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5" /><path d="M9 5h10v10" /></symbol>
        <symbol id="i-triangle" viewBox="0 0 24 24"><path d="M12 3.5 21 20H3z" /></symbol>
        <symbol id="i-cuboid" viewBox="0 0 24 24"><path d="M3 8.5h13v12H3z" /><path d="m3 8.5 4.5-4.5H21l-5 4.5" /><path d="M21 4v12l-5 4.5" /></symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></symbol>
        <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3" /><path d="M9 20h6" /><path d="M12 4v16" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" /></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5" /><rect width="7" height="7" x="14" y="3" rx="1.5" /><rect width="7" height="7" x="14" y="14" rx="1.5" /><rect width="7" height="7" x="3" y="14" rx="1.5" /></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="m16 6-4-4-4 4" /><path d="M12 2v13" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></symbol>
        <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M22 14a8 8 0 0 1-8 8" /><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2" /><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1" /><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10" /><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></symbol>
        <symbol id="i-note" viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z" /><path d="M15 3v5a1 1 0 0 0 1 1h5" /><path d="M7 13h6M7 17h9" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></symbol>
        <symbol id="i-max" viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M9 21H3v-6" /><path d="M21 3l-7 7" /><path d="M3 21l7-7" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /><path d="M7 3v4a1 1 0 0 0 1 1h7" /></symbol>
        <symbol id="i-save-as" viewBox="0 0 24 24"><path d="M13 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10.2a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V12" /><path d="M7 3v4a1 1 0 0 0 1 1h7" /><path d="M18 16v6" /><path d="M15 19h6" /></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13" /><path d="M8 12h13" /><path d="M8 18h13" /><path d="M3 6h.01" /><path d="M3 12h.01" /><path d="M3 18h.01" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
        <symbol id="i-rename" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></symbol>
        <symbol id="i-undo2" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5A5.5 5.5 0 0 1 14.5 20H11" /></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5" /><path d="M14 10V4a2 2 0 0 0-4 0v2" /><path d="M10 10.5V6a2 2 0 0 0-4 0v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></symbol>
      </defs>
    </svg>

    <main id="app" class="app">
      <div id="stage" class="stage" aria-label="Canvas" role="img">
        <canvas id="paper" class="layer" width="1" height="1"></canvas>
        <canvas id="ink" class="layer"></canvas>
        <canvas id="overlay" class="layer"></canvas>
      </div>

      <div id="hint" class="hint" hidden>
        <p class="hint-1" data-i18n="hint">Just start drawing</p>
        <p class="hint-2" data-i18n="hint2">2 fingers: zoom & pan · 2-finger tap: undo</p>
      </div>

      <header class="bar bar-top chrome">
        <div class="pill">
          <button class="btn" data-act="gallery" data-i18n-label="open"><svg><use href="#i-grid" /></svg></button>
          <button class="btn" data-act="undo" data-i18n-label="undo" disabled><svg><use href="#i-undo" /></svg></button>
          <button class="btn" data-act="redo" data-i18n-label="redo" disabled><svg><use href="#i-redo" /></svg></button>
        </div>
        <button class="doc" data-act="rename" id="doc"><span id="doc-name"></span><i id="doc-dot" hidden></i></button>
        <div class="pill">
          <button class="btn zoom-chip" data-act="fit" data-i18n-label="fit" hidden><span id="zoom-label">100%</span></button>
          <button class="btn" data-act="save" id="save-btn" data-i18n-label="save"><svg><use href="#i-save" /></svg><i class="badge" id="save-dot" hidden></i></button>
          <button class="btn" data-act="menu" data-i18n-label="more" aria-haspopup="menu"><svg><use href="#i-more" /></svg></button>
        </div>
      </header>

      <footer class="bar bar-bottom chrome">
        <div class="pill dock" role="toolbar" data-i18n-label="tools">
          <button class="btn tool" data-tool="pen" data-i18n-label="pen" aria-pressed="true"><svg><use href="#i-pen" /></svg></button>
          <button class="btn tool" data-tool="shape" data-i18n-label="shape" aria-pressed="false"><svg><use id="shape-icon" href="#i-rect" /></svg><i class="caret"></i></button>
          <button class="btn tool" data-tool="eraser" data-i18n-label="eraser" aria-pressed="false"><svg><use href="#i-eraser" /></svg></button>
          <button class="btn tool" data-tool="text" data-i18n-label="text" aria-pressed="false"><svg><use href="#i-text" /></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button class="btn" data-act="color" data-i18n-label="color" aria-haspopup="dialog"><span id="color-dot" class="dot"></span></button>
          <button class="btn" data-act="size" data-i18n-label="size" aria-haspopup="dialog"><span id="size-dot" class="size-dot"></span></button>
        </div>
      </footer>

      <button id="restore" class="restore" data-act="chrome" data-i18n-label="showBars" hidden><svg><use href="#i-eye" /></svg></button>

      <!-- Popovers -->
      <div id="pop-color" class="pop pop-bottom" role="dialog" data-i18n-label="color" hidden>
        <p class="pop-label" data-i18n="color">Colour</p>
        <div id="inks" class="swatches"></div>
        <p class="pop-label" data-i18n="paper">Paper</p>
        <div id="papers" class="swatches"></div>
      </div>

      <div id="pop-size" class="pop pop-bottom" role="dialog" data-i18n-label="size" hidden>
        <div class="size-head">
          <p class="pop-label" id="size-title" data-i18n="size">Size</p>
          <span id="size-value" class="size-value">8</span>
        </div>
        <div class="size-preview"><span id="size-preview"></span></div>
        <input id="size-range" class="range" type="range" min="1" max="64" value="8" data-i18n-label="size" />
        <div id="size-presets" class="presets"></div>
      </div>

      <div id="pop-shape" class="pop pop-bottom" role="dialog" data-i18n-label="shape" hidden>
        <div class="seg shapes">
          <button class="btn" data-shape="line" data-i18n-label="line"><svg><use href="#i-line" /></svg></button>
          <button class="btn" data-shape="arrow" data-i18n-label="arrow"><svg><use href="#i-arrow" /></svg></button>
          <button class="btn" data-shape="rect" data-i18n-label="rect"><svg><use href="#i-rect" /></svg></button>
          <button class="btn" data-shape="circle" data-i18n-label="circle"><svg><use href="#i-circle" /></svg></button>
          <button class="btn" data-shape="ellipse" data-i18n-label="ellipse"><svg><use href="#i-ellipse" /></svg></button>
          <button class="btn" data-shape="triangle" data-i18n-label="triangle"><svg><use href="#i-triangle" /></svg></button>
          <button class="btn" data-shape="cuboid" data-i18n-label="cuboid"><svg><use href="#i-cuboid" /></svg></button>
        </div>
        <div class="seg fill-row">
          <button class="btn chip note-chip" data-act="add-note"><svg><use href="#i-note" /></svg><span data-i18n="addNote">Note</span></button>
          <button class="btn chip" id="fill-toggle" aria-pressed="false" data-i18n="fill">Fill</button>
        </div>
      </div>

      <div id="pop-menu" class="pop pop-top menu" role="menu" hidden>
        <button class="item" role="menuitem" data-act="gallery"><svg><use href="#i-grid" /></svg><span data-i18n="open">Open</span></button>
        <button class="item" role="menuitem" data-act="save"><svg><use href="#i-save" /></svg><span data-i18n="save">Save</span></button>
        <button class="item" role="menuitem" data-act="save-as"><svg><use href="#i-save-as" /></svg><span data-i18n="saveAs">Save as…</span></button>
        <button class="item" role="menuitem" data-act="download"><svg><use href="#i-download" /></svg><span data-i18n="download">Download as image</span></button>
        <button class="item" role="menuitem" data-act="rename"><svg><use href="#i-rename" /></svg><span data-i18n="rename">Rename</span></button>
        <button class="item" role="menuitem" data-act="revert" id="item-revert" hidden><svg><use href="#i-undo2" /></svg><span data-i18n="revert">Discard changes</span></button>
        <hr class="menu-sep" />
        <button class="item" role="menuitem" data-act="new"><svg><use href="#i-plus" /></svg><span data-i18n="newSheet">New sheet</span></button>
        <button class="item" role="menuitem" data-act="share"><svg><use href="#i-share" /></svg><span data-i18n="share">Share as image</span></button>
        <button class="item" role="menuitem" data-act="clear"><svg><use href="#i-trash" /></svg><span data-i18n="clear">Clear sheet</span></button>
        <hr class="menu-sep" />
        <button class="item" role="menuitem" data-act="chrome"><svg><use href="#i-eye-off" /></svg><span data-i18n="hideBars">Hide toolbars</span></button>
        <hr class="menu-sep" />
        <button class="item" role="menuitem" data-act="settings"><svg><use href="#i-gear" /></svg><span data-i18n="settings">Settings</span></button>
      </div>

      <!-- Text: hint when tapping a placed text -->
      <div id="text-hint" class="text-hint" hidden><svg><use href="#i-hand" /></svg><span data-i18n="holdToSelect">Hold to select</span></div>

      <!-- Text composer -->
      <form id="composer" class="composer" hidden>
        <div class="composer-tools">
          <div id="composer-inks" class="composer-inks" role="group" data-i18n-label="color"></div>
          <label class="composer-size" id="composer-alpha-row" hidden><span aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" /></svg></span><input id="composer-alpha" class="range" type="range" min="10" max="100" step="5" value="100" data-i18n-label="opacity" /><output id="composer-alpha-val">100%</output></label>
          <label class="composer-size"><span aria-hidden="true">A</span><input id="composer-size" class="range" type="range" min="12" max="120" value="28" data-i18n-label="fontSize" /><output id="composer-size-val">28</output></label>
        </div>
        <input id="composer-input" maxlength="200" enterkeyhint="done" autocomplete="off" autocorrect="off" data-i18n-ph="textPlaceholder" data-i18n-label="text" />
        <button type="button" class="btn" id="composer-note" data-act="note-text" data-i18n-label="editText" hidden><svg><use href="#i-rename" /></svg></button>
        <button type="button" class="btn" id="composer-del" data-act="delete-text" data-i18n-label="delete" hidden><svg><use href="#i-trash" /></svg></button>
        <button type="submit" class="cta" data-i18n="place">Place</button>
        <button type="button" class="btn" data-act="cancel-text" data-i18n-label="cancel"><svg><use href="#i-x" /></svg></button>
      </form>

      <!-- Gallery -->
      <section id="gallery" class="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
        <header class="gallery-head">
          <h1 id="gallery-title" data-i18n="sheets">Sheets</h1>
          <button class="btn" id="view-toggle" data-act="view" aria-label="View"><svg><use id="view-icon" href="#i-list" /></svg></button>
          <button class="cta" data-act="new"><svg><use href="#i-plus" /></svg><span data-i18n="newSheet">New sheet</span></button>
          <button class="btn" data-act="gallery-close" data-i18n-label="close"><svg><use href="#i-x" /></svg></button>
        </header>
        <div class="gallery-tools">
          <label class="search"><svg><use href="#i-search" /></svg><input id="search" type="search" enterkeyhint="search" autocomplete="off" data-i18n-ph="search" data-i18n-label="search" /></label>
          <button class="chip" id="sort-toggle" data-act="sort" type="button"></button>
        </div>
        <ul id="gallery-list" class="gallery-list"></ul>
        <p id="gallery-empty" class="gallery-empty" hidden></p>
      </section>

      <!-- Confirm -->
      <div id="confirm" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
        <div class="modal-card">
          <h2 id="confirm-title"></h2>
          <p id="confirm-body"></p>
          <div class="modal-actions">
            <button type="button" class="ghost" id="confirm-no" data-i18n="cancel">Cancel</button>
            <button type="button" class="ghost" id="confirm-alt" hidden></button>
            <button type="button" class="cta" id="confirm-yes"></button>
          </div>
        </div>
      </div>

      <form id="note-editor" class="modal" role="dialog" aria-modal="true" aria-labelledby="note-editor-title" hidden>
        <div class="modal-card">
          <h2 id="note-editor-title" data-i18n="note">Note</h2>
          <input id="note-title" class="text-input" maxlength="80" autocomplete="off" enterkeyhint="next" data-i18n-ph="noteTitle" data-i18n-label="noteTitle" />
          <textarea id="note-body" class="text-input note-body" maxlength="2000" rows="5" data-i18n-ph="noteBody" data-i18n-label="noteBody"></textarea>
          <div class="modal-actions">
            <button type="button" class="ghost" id="note-no" data-i18n="cancel">Cancel</button>
            <button type="submit" class="cta" id="note-yes" data-i18n="done">Done</button>
          </div>
        </div>
      </form>

      <form id="prompt" class="modal" role="dialog" aria-modal="true" aria-labelledby="prompt-title" hidden>
        <div class="modal-card">
          <h2 id="prompt-title"></h2>
          <input id="prompt-input" class="text-input" maxlength="60" autocomplete="off" autocorrect="off" enterkeyhint="done" data-i18n-ph="namePlaceholder" data-i18n-label="namePlaceholder" />
          <div class="modal-actions">
            <button type="button" class="ghost" id="prompt-no" data-i18n="cancel">Cancel</button>
            <button type="submit" class="cta" id="prompt-yes"></button>
          </div>
        </div>
      </form>

      <div id="settings" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
        <div class="modal-card settings-card">
          <header class="settings-head">
            <h2 id="settings-title" data-i18n="settings">Settings</h2>
            <button class="btn" data-act="settings-close" data-i18n-label="close"><svg><use href="#i-x" /></svg></button>
          </header>
          <button class="row" role="switch" id="set-autosave" aria-checked="false">
            <span class="row-text"><b data-i18n="autosave">Autosave</b><small data-i18n="autosaveHint">Write changes into the sheet right away. Off: only when you tap Save.</small></span>
            <span class="switch"><i></i></span>
          </button>
          <button class="row" role="switch" id="set-full" aria-checked="true" hidden>
            <span class="row-text"><b data-i18n="startFull">Start app in full screen</b><small data-i18n="startFullHint">Goes full screen with your first tap.</small></span>
            <span class="switch"><i></i></span>
          </button>
          <label class="row" for="set-lang">
            <span class="row-text"><b data-i18n="language">Language</b></span>
            <select id="set-lang">
              <option value="auto" data-i18n="langAuto">Automatic</option>
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </label>
          <button class="row" role="switch" id="set-fingers" aria-checked="false" hidden>
            <span class="row-text"><b data-i18n="fingersDraw">Draw with finger</b></span>
            <span class="switch"><i></i></span>
          </button>
          <button class="row" data-act="install" id="set-install" hidden>
            <span class="row-text"><b data-i18n="install">Install as app</b></span>
            <svg><use href="#i-plus" /></svg>
          </button>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-action" type="button" hidden></button></div>
    </main>

    <noscript>Jotter needs JavaScript. / Jotter braucht JavaScript.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
