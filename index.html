<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>Jotter</title>
    <meta name="description" content="Schnelle, offline-fähige Zeichen- und Notiz-App für Handy, Tablet und Desktop. Keine Anmeldung, keine Werbung, alles bleibt auf deinem Gerät." />
    <meta name="theme-color" content="#141311" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jotter" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <!-- Icons: Lucide (ISC licence), https://lucide.dev -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></symbol>
        <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5" /></symbol>
        <symbol id="i-rect" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
        <symbol id="i-ellipse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /></symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" /><path d="M22 21H7" /><path d="m5 11 9 9" /></symbol>
        <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3" /><path d="M9 20h6" /><path d="M12 4v16" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" /></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" /></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1.5" /><rect width="7" height="7" x="14" y="3" rx="1.5" /><rect width="7" height="7" x="14" y="14" rx="1.5" /><rect width="7" height="7" x="3" y="14" rx="1.5" /></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="m16 6-4-4-4 4" /><path d="M12 2v13" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></symbol>
        <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="M12 5v14" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></symbol>
        <symbol id="i-max" viewBox="0 0 24 24"><path d="M15 3h6v6" /><path d="M9 21H3v-6" /><path d="M21 3l-7 7" /><path d="M3 21l7-7" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" /><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" /><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" /><path d="m2 2 20 20" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5" /><path d="M14 10V4a2 2 0 0 0-4 0v2" /><path d="M10 10.5V6a2 2 0 0 0-4 0v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" /></symbol>
      </defs>
    </svg>

    <main id="app" class="app">
      <div id="stage" class="stage" aria-label="Zeichenfläche" role="img">
        <canvas id="ink" class="layer"></canvas>
        <canvas id="overlay" class="layer"></canvas>
      </div>

      <div id="hint" class="hint" hidden>
        <p class="hint-1" data-i18n="hint">Einfach loszeichnen</p>
        <p class="hint-2" data-i18n="hint2"></p>
      </div>

      <header class="bar bar-top chrome">
        <div class="pill">
          <button class="btn" data-act="gallery" data-i18n-label="sheets"><svg><use href="#i-grid" /></svg></button>
          <button class="btn" data-act="undo" data-i18n-label="undo" disabled><svg><use href="#i-undo" /></svg></button>
          <button class="btn" data-act="redo" data-i18n-label="redo" disabled><svg><use href="#i-redo" /></svg></button>
        </div>
        <div class="pill">
          <button class="btn zoom-chip" data-act="fit" data-i18n-label="fit" hidden><span id="zoom-label">100%</span></button>
          <button class="btn" data-act="share" data-i18n-label="share"><svg><use href="#i-share" /></svg></button>
          <button class="btn" data-act="menu" data-i18n-label="more" aria-haspopup="menu"><svg><use href="#i-more" /></svg></button>
        </div>
      </header>

      <footer class="bar bar-bottom chrome">
        <div class="pill dock" role="toolbar" data-i18n-label="tools">
          <button class="btn tool" data-tool="pen" data-i18n-label="pen" aria-pressed="true"><svg><use href="#i-pen" /></svg></button>
          <button class="btn tool" data-tool="shape" data-i18n-label="shape" aria-pressed="false"><svg><use id="shape-icon" href="#i-rect" /></svg><i class="caret"></i></button>
          <button class="btn tool" data-tool="eraser" data-i18n-label="eraser" aria-pressed="false"><svg><use href="#i-eraser" /></svg></button>
          <button class="btn tool" data-tool="text" data-i18n-label="text" aria-pressed="false"><svg><use href="#i-text" /></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button class="btn" data-act="color" data-i18n-label="color" aria-haspopup="dialog"><span id="color-dot" class="dot"></span></button>
          <button class="btn" data-act="size" data-i18n-label="size" aria-haspopup="dialog"><span id="size-dot" class="size-dot"></span></button>
        </div>
      </footer>

      <button id="restore" class="restore" data-act="chrome" data-i18n-label="showBars" hidden><svg><use href="#i-eye" /></svg></button>

      <!-- Popovers -->
      <div id="pop-color" class="pop pop-bottom" role="dialog" data-i18n-label="color" hidden>
        <p class="pop-label" data-i18n="color">Farbe</p>
        <div id="inks" class="swatches"></div>
        <p class="pop-label" data-i18n="paper">Papier</p>
        <div id="papers" class="swatches"></div>
      </div>

      <div id="pop-size" class="pop pop-bottom" role="dialog" data-i18n-label="size" hidden>
        <div class="size-head">
          <p class="pop-label" id="size-title" data-i18n="size">Stärke</p>
          <span id="size-value" class="size-value">8</span>
        </div>
        <div class="size-preview"><span id="size-preview"></span></div>
        <input id="size-range" class="range" type="range" min="1" max="64" value="8" data-i18n-label="size" />
        <div id="size-presets" class="presets"></div>
      </div>

      <div id="pop-shape" class="pop pop-bottom" role="dialog" data-i18n-label="shape" hidden>
        <div class="seg">
          <button class="btn" data-shape="line" data-i18n-label="line"><svg><use href="#i-line" /></svg></button>
          <button class="btn" data-shape="rect" data-i18n-label="rect"><svg><use href="#i-rect" /></svg></button>
          <button class="btn" data-shape="ellipse" data-i18n-label="ellipse"><svg><use href="#i-ellipse" /></svg></button>
          <span class="sep" aria-hidden="true"></span>
          <button class="btn chip" id="fill-toggle" aria-pressed="false" data-i18n="fill">Füllen</button>
        </div>
      </div>

      <div id="pop-menu" class="pop pop-top menu" role="menu" hidden>
        <button class="item" role="menuitem" data-act="new"><svg><use href="#i-plus" /></svg><span data-i18n="newSheet">Neues Blatt</span></button>
        <button class="item" role="menuitem" data-act="clear"><svg><use href="#i-trash" /></svg><span data-i18n="clear">Blatt leeren</span></button>
        <button class="item" role="menuitem" data-act="fullscreen" id="item-full"><svg><use href="#i-max" /></svg><span id="full-label" data-i18n="fullscreen">Vollbild</span></button>
        <button class="item" role="menuitem" data-act="chrome"><svg><use href="#i-eye-off" /></svg><span data-i18n="hideBars">Leisten ausblenden</span></button>
        <button class="item" role="menuitemcheckbox" data-act="fingers" id="item-fingers" hidden><svg><use href="#i-hand" /></svg><span data-i18n="fingersDraw">Mit Finger zeichnen</span></button>
        <button class="item" role="menuitem" data-act="install" id="item-install" hidden><svg><use href="#i-download" /></svg><span data-i18n="install">Als App installieren</span></button>
      </div>

      <!-- Text composer -->
      <form id="composer" class="composer" hidden>
        <input id="composer-input" maxlength="200" enterkeyhint="done" autocomplete="off" autocorrect="off" data-i18n-ph="textPlaceholder" data-i18n-label="text" />
        <button type="submit" class="cta" data-i18n="place">Setzen</button>
        <button type="button" class="btn" data-act="cancel-text" data-i18n-label="cancel"><svg><use href="#i-x" /></svg></button>
      </form>

      <!-- Gallery -->
      <section id="gallery" class="gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
        <header class="gallery-head">
          <h1 id="gallery-title" data-i18n="sheets">Blätter</h1>
          <button class="cta" data-act="new"><svg><use href="#i-plus" /></svg><span data-i18n="newSheet">Neues Blatt</span></button>
          <button class="btn" data-act="gallery-close" data-i18n-label="close"><svg><use href="#i-x" /></svg></button>
        </header>
        <ul id="gallery-list" class="gallery-list"></ul>
      </section>

      <!-- Confirm -->
      <div id="confirm" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
        <div class="modal-card">
          <h2 id="confirm-title"></h2>
          <p id="confirm-body"></p>
          <div class="modal-actions">
            <button type="button" class="ghost" id="confirm-no" data-i18n="cancel">Abbrechen</button>
            <button type="button" class="cta" id="confirm-yes"></button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-action" type="button" hidden></button></div>
    </main>

    <noscript>Jotter braucht JavaScript. / Jotter needs JavaScript.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
